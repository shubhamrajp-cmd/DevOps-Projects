name: CI

on:
  push:
    branches: [ "master" ]
    paths:
      - 'DevOps-Project-05/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'DevOps-Project-05/**'

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      # 1. Set up Java Environment
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'

      # 2. Build the application to generate the .war file
      - name: Build War File
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean package
            cp target/*.war ./
          elif [ -f "build.gradle" ]; then
            ./gradlew build
            cp build/libs/*.war ./
          else
            echo "No build file found, creating a dummy war file for testing"
            echo "Hello World" > sample.war
          fi
        working-directory: ./DevOps-Project-05

      # 3. Prepare Docker Environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker setup
        uses: docker/login-action@v3
        with: 
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Run the Docker build using the correct context folder
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./DevOps-Project-05
          file: ./DevOps-Project-05/hello-world/Dockerfile
          push: true
          tags: srajput2403/devops-project:latest


      # 3. Log in to Docker Hub using your verified variable and secret
      - name: Docker setup
        uses: docker/login-action@v3
        with: 
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and Push the image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./DevOps-Project-05
          file: ./DevOps-Project-05/hello-world/Dockerfile
          push: true
          tags: srajput2403/devops-project:latest
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull srajput2403/devops-project:latest
            docker stop myapp || true
            docker rm myapp || true
            docker run -d --name myapp -p 80:8080 --restart unless-stopped srajput2403/devops-project:latest
          

