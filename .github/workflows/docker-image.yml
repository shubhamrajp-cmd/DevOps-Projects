name: CI
on:
  push:
   branches: [master]
    paths:
      - 'DevOps-Project-04/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'DevOps-Project-04/**'
jobs:
 code:
  runs-on: ubuntu-latest
  steps:
   - name: checkout code
     uses: actions/checkout@v7
    - name: Docker setup
      uses: docker/login-actionv@4
      with: 
        username: ${{ secrets:DOCKERHUB_USERNAME }}
        password: ${{ secrets:DOCKERHUB_TOKEN }}
