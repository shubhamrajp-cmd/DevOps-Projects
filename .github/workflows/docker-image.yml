name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug file list
        run: |
          pwd
          ls -la
          find . -iname "*dockerfile*" -not -path "./.git/*"

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag my-image-name:${{ github.sha }}

      - name: Show the built image
        run: docker images
