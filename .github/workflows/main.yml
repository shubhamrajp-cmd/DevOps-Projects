name: CI
on:
  push:
    branches: [ "master" ]
    paths:
      - 'DevOps-Project-04/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'DevOps-Project-04/**'

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Docker setup
        uses: docker/login-action@v4
        with: 
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./DevOps-Project-04
          file: ./DevOps-Project-04/Dockerfile
          push: true # Only push on actual master branch commits
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devops-project:latest
